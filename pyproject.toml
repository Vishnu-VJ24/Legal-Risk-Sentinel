[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-sentinel"
version = "0.1.0"
description = "Legal Sentinel contract analysis workspace"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.135.3",
    "numpy>=2.3.4",
    "openai>=2.31.0",
    "pdfplumber>=0.11.9",
    "pymupdf>=1.27.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.24",
    "regex>=2026.2.28",
    "requests>=2.32.5",
    "uvicorn>=0.44.0",
]

[tool.setuptools]
packages = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
